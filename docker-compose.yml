version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nurse-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: hospital_rbac_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d hospital_rbac_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nurse-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nurse-app-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hospital.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nurse-app-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devuser:devpassword@postgres:5432/hospital_rbac_dev?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      JWT_SECRET: dev-secret-key-change-in-production-please-use-64-chars-min
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-please-use-64-chars
      CORS_ORIGIN: http://localhost:3000,http://localhost:80
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nurse-app-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      # NB: Vite serves static assets from `<root>/public`, i.e. /app/public is
      # not the frontend's public dir when the app lives in /app/frontend - the
      # old `./frontend/public:/app/public` mount pointed at a path nothing
      # read. index.html and assets are already inside ./frontend/src's image
      # context via the Dockerfile COPY, so no extra mount is needed.
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
